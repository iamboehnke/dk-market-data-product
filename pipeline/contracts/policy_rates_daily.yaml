id: policy_rates_daily
version: 1.0.0
name: Pengepolitiske renter og DESTR, daglige
domain: Markedsdata
owner: Mikkel Bøhnke
description: >
  Nationalbankens officielle renter og referencerenten DESTR. Én række pr.
  bankdag og instrument. DESTR offentliggøres med én bankdags forsinkelse,
  så den seneste dag kan mangle og udfyldes ved næste kørsel.
source:
  system: Danmarks Nationalbank via Danmarks Statistik (Statistikbanken)
  table: DNRENTD
  api: https://api.statbank.dk/v1/data
  filters:
    INSTRUMENT: [OFONAA, OIBNAA, ODKNAA, OIRNAA, DESNAA]
    LAND: [DK]
    OPGOER: [E]
  value_column: INDHOLD
  missing_marker: ".."
schedule: Hverdage kl. 07:30 UTC, sammen med fx_daily.
grain: Én række pr. dato og instrument
primary_key: [rate_date, instrument]
schema:
  - {name: rate_date, type: date, nullable: false, description: Bankdagen renten gælder for}
  - {name: instrument, type: string, nullable: false, description: Statistikbankens instrumentkode}
  - {name: instrument_name, type: string, nullable: false, description: Instrumentets navn på dansk}
  - {name: rate_pct, type: decimal(9,4), nullable: false, description: Rente i procent p.a.}
  - {name: change_bp, type: decimal(9,2), nullable: true, description: Ændring i basispoint siden forrige bankdag}
labels:
  OFONAA: Foliorente (pengepolitisk rente)
  OIBNAA: Indskudsbeviser
  ODKNAA: Diskonto
  OIRNAA: Udlånsrente
  DESNAA: DESTR (referencerente)
quality:
  - {check: not_null, columns: [rate_date, instrument], severity: error}
  - {check: not_null, columns: [rate_pct], severity: warn, description: DESTR kan mangle for seneste bankdag og udfyldes ved næste kørsel}
  - {check: unique, columns: [rate_date, instrument], severity: error}
  - {check: accepted_values, column: instrument, values: [OFONAA, OIBNAA, ODKNAA, OIRNAA, DESNAA], severity: error}
  - {check: range, column: rate_pct, min: -2, max: 15, severity: error, description: Renter uden for -2 til 15 % er næsten sikkert en fejl}
  - {check: max_abs_change_bp, column: rate_pct, group_by: instrument, max: 75, severity: warn, description: Rentebeslutninger over 75 bp markeres til manuel kontrol}
  - {check: freshness, column: rate_date, warn_after_days: 5, error_after_days: 10}
consumers:
  - mikkelbohnke.com (widget)
  - Django API og datakatalog
  - Azure SQL, tabellen gold.policy_rate_daily
